# Git hooks. Install with `make install` (or `pnpm exec lefthook install`).
# pre-commit stays fast: only staged files, per-file commands. pre-push runs the broader checks.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,mts,mjs,js,json,css,md}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,mts}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    ruff-check:
      glob: "backend/**/*.py"
      run: uv run --no-sync --project backend/api ruff check {staged_files}
    ruff-format:
      glob: "backend/**/*.py"
      run: uv run --no-sync --project backend/api ruff format {staged_files}
      stage_fixed: true

pre-push:
  commands:
    frontend:
      run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm test
    backend:
      run: uv run --no-sync --project backend/api ruff check . && uv run --no-sync --project backend/api ruff format --check . && uv run --no-sync --project backend/api pyright && cd backend/api && uv run --no-sync pytest -q
    # No database needed: single-head check + offline SQL render of every migration.
    migrations:
      run: cd backend/api && uv run --no-sync alembic heads && uv run alembic upgrade head --sql > /dev/null
    # Read-only: fails if backend/api/openapi.json is stale, without touching the tree.
    openapi:
      run: uv run --no-sync --project backend/api python backend/api/scripts/check_openapi_fresh.py
