# Git hooks. Install with `make install` (or `pnpm exec lefthook install`).
# pre-commit stays fast: only staged files. pre-push runs the broader checks.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm lint
    ruff-check:
      glob: "backend/**/*.py"
      exclude: backend/api/tests/**
      run: uv run --project backend/api ruff check {staged_files}
    ruff-format:
      glob: "backend/**/*.py"
      run: uv run --project backend/api ruff format {staged_files}
      stage_fixed: true

pre-push:
  commands:
    frontend:
      run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm test
    backend:
      run: uv run --project backend/api ruff check . && uv run --project backend/api ruff format --check . && uv run --project backend/api pyright && uv run --project backend/api pytest -q
