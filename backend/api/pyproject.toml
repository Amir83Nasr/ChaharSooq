[project]
name = "charsooq-api"
version = "0.1.0"
description = "Charsooq admin API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "pyright>=1.1",
  "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "DTZ", "A", "C4"]
# TRY/EM intentionally off: user-facing Persian error strings are raised
# inline by design (see services + integrations); wrapping every raise
# in a variable/message-class would add noise without safety value.

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and fixture credentials by design.
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--cov=app", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*", "scripts/*"]
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.pyright]
typeCheckingMode = "strict"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.alembic]
script_location = "migrations"
