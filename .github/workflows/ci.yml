name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so the release workflow can run the same checks against the exact
  # release commit before any image is published.
  workflow_call:
    inputs:
      ref:
        description: >-
          The commit-ish the checks must run against. Empty means the ref that
          triggered the workflow, which is the default for a push and for a
          pull request. The release workflow passes the release tag so the
          checks run against the commit that is about to be published.
        required: false
        type: string

concurrency:
  # The reusable call passes the release tag, so a release verification never
  # shares a group with the push or the pull-request runs on `main` and cannot
  # cancel them.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Empty for a push and for a pull request, which keeps the default
          # behaviour. The release workflow passes the release tag, so the
          # checks run against the published commit.
          ref: ${{ inputs.ref }}
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: charsooq
          POSTGRES_PASSWORD: charsooq
          POSTGRES_DB: charsooq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U charsooq"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://charsooq:charsooq@localhost:5432/charsooq_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Empty for a push and for a pull request, which keeps the default
          # behaviour. The release workflow passes the release tag, so the
          # checks run against the published commit.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --project backend/api
      - run: uv run --project backend/api ruff check .
      - run: uv run --project backend/api ruff format --check .
      - run: uv run --project backend/api pyright
      - run: cd backend/api && uv run pytest -q
      - name: Check OpenAPI snapshot is fresh
        run: uv run --project backend/api python backend/api/scripts/check_openapi_fresh.py

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: charsooq
          POSTGRES_PASSWORD: charsooq
          POSTGRES_DB: charsooq_migtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U charsooq"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://charsooq:charsooq@localhost:5432/charsooq_migtest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Empty for a push and for a pull request, which keeps the default
          # behaviour. The release workflow passes the release tag, so the
          # checks run against the published commit.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --project backend/api
      # Fresh database straight to head, twice: upgrades must be idempotent.
      - run: cd backend/api && uv run alembic upgrade head
      - run: cd backend/api && uv run alembic upgrade head
      # Exactly one head — a second head means an unmerged migration branch.
      - name: Assert single head
        run: |
          cd backend/api
          heads="$(uv run alembic heads)"
          echo "$heads"
          [ "$(printf '%s' "$heads" | grep -c .)" -eq 1 ]
      # Models and migrations must agree; drift fails the build here, not prod.
      - name: Model/migration drift check
        run: cd backend/api && uv run alembic check
      # Full downgrade/upgrade round-trip: every migration must roll back too.
      - name: Downgrade/upgrade round-trip
        run: cd backend/api && uv run alembic downgrade base && uv run alembic upgrade head

  build:
    runs-on: ubuntu-latest
    needs: [frontend, backend, migrations]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Empty for a push and for a pull request, which keeps the default
          # behaviour. The release workflow passes the release tag, so the
          # checks run against the published commit.
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # e2e runs against the production build served by `next start`.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
