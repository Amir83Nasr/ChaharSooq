name: Release

# A version tag is the release request. CI and image publication run first;
# the GitHub Release is published last, with the verified digests already in
# its body. A push to `main` is never a Production release (AGENTS.md, section 3).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.0)."
        required: true
        type: string

concurrency:
  # Publishes are serialized so the `latest` discovery pointer always names
  # the newest completed release (ADR 018). Two releases must not race.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release commit
    # The whole check suite runs against the exact release commit before any
    # image is published. ci.yml is reusable for that purpose.
    uses: ./.github/workflows/ci.yml
    with:
      # The tag, not a branch: the checks must run against the commit that is
      # about to be published, not against whatever `main` happens to point at.
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  release:
    name: Publish the images and the GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` publishes the release and records its body.
      # `pull-requests: read` supplies PR titles for the release notes.
      # `packages: write` is the registry. `id-token: write` and
      # `attestations: write` back the build provenance attestation.
      contents: write
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      API_IMAGE_NAME: chaharsooq-api
      WEB_IMAGE_NAME: chaharsooq-web
      # The web image bakes the internal API address into the Next.js rewrite
      # at build time. It must stay identical to compose.production.yml; a
      # mismatch is a wrong rewrite in the released image.
      API_URL_INTERNAL: http://api:8000
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate the release tag
        id: validate
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '${TAG}' is not a valid release tag; expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve the release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A previous run may have left a draft after a failed image build.
          # Reuse that draft, but never overwrite a release that is public.
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
            if [ "$(jq -r '.draft' <<<"$release_json")" != "true" ]; then
              echo "::error::release ${TAG} is already published; publish a new version instead"
              exit 1
            fi
            echo "draft_id=$(jq -r '.id' <<<"$release_json")" >> "$GITHUB_OUTPUT"
            echo "Reusing the draft release left by an interrupted run of ${TAG}."
          else
            echo "draft_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The tag, not a branch: both the images and the release notes must
          # come from the released commit, never from `main`.
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the build metadata
        id: meta
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD^{commit})"
          tag_sha="$(git rev-parse "${TAG}^{commit}")"
          if [ "$sha" != "$tag_sha" ]; then
            echo "::error::checked out ${sha} does not match ${TAG} (${tag_sha})"
            exit 1
          fi
          namespace="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${namespace}/${API_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${namespace}/${WEB_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The repository token is the only credential: no new secret is
          # created for publishing.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing release tag
        id: guard
        env:
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          VERSION: ${{ steps.validate.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          # The version tag is the release identity and the SHA tag is the
          # commit alias. Both are written once: the registry does not
          # guarantee immutable tags, so this check is what keeps a tag from
          # being re-pointed at bytes other than the recorded digest. The
          # `latest` pointer is deliberately excluded: it is moved on every
          # release and is never used as a deployment reference.
          # The window between this check and the push is a race that only a
          # registry with immutable tags can close.
          existing=""
          for reference in "${API_IMAGE}:${VERSION}" "${WEB_IMAGE}:${VERSION}" \
            "${API_IMAGE}:sha-${SHA}" "${WEB_IMAGE}:sha-${SHA}"; do
            if output="$(docker buildx imagetools inspect "${reference}" 2>&1)"; then
              existing="${existing} ${reference}"
            elif ! printf '%s' "$output" | grep -qi 'not found'; then
              # An unknown registry state is not an absent tag: fail closed
              # rather than push over a tag that may exist.
              echo "::error::could not determine whether ${reference} exists; refusing to publish"
              printf '%s\n' "$output"
              exit 1
            fi
          done
          if [ -n "$existing" ]; then
            echo "::error::these release tags already exist:${existing}; a release tag is written once, publish a new version instead"
            exit 1
          fi

      - name: Build and push the API image
        id: build_api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: true
          # Version and SHA tags are written once. `latest` is a mutable
          # discovery pointer only: the server resolves it to a digest and
          # verifies the release labels before deploying.
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.validate.outputs.version }}
            ${{ steps.meta.outputs.api_image }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.api_image }}:latest
          build-args: |
            VCS_REF=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.validate.outputs.version }}
            SOURCE=${{ steps.meta.outputs.source }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          # BuildKit attaches a provenance attestation and an SBOM to the
          # published image.
          provenance: mode=max
          sbom: true

      - name: Build and push the web image
        id: build_web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.validate.outputs.version }}
            ${{ steps.meta.outputs.web_image }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.web_image }}:latest
          build-args: |
            API_URL_INTERNAL=${{ env.API_URL_INTERNAL }}
            VCS_REF=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.validate.outputs.version }}
            SOURCE=${{ steps.meta.outputs.source }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Attest the API image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.api_image }}
          subject-digest: ${{ steps.build_api.outputs.digest }}
          push-to-registry: true

      - name: Attest the web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.web_image }}
          subject-digest: ${{ steps.build_web.outputs.digest }}
          push-to-registry: true

      - name: Verify the published images
        id: verify_images
        env:
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          VERSION: ${{ steps.validate.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            # The published bytes must name the release commit. The revision
            # label is the only link from an image back to a commit, so it is
            # read back from the registry instead of trusted.
            revisions="$(docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{json .Image}}' \
              | jq -r '.. | objects | select(has("config")) | .config.Labels?["org.opencontainers.image.revision"]? // empty' \
              | sort -u)"
            if [ "$revisions" != "$SHA" ]; then
              echo "::error::${image}:${VERSION} reports revision '${revisions}', expected ${SHA}"
              exit 1
            fi
            # Provenance and SBOM travel with the image as an attestation
            # manifest inside the published index.
            attestations="$(docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{json .Manifest}}' \
              | jq -r '[.manifests[]?.annotations["vnd.docker.reference.type"] // ""] | map(select(. == "attestation-manifest")) | length')"
            if [ "$attestations" -lt 1 ]; then
              echo "::error::${image}:${VERSION} carries no attestation manifest"
              exit 1
            fi
            # The discovery pointer must name the exact bytes just verified.
            pointer="$(docker buildx imagetools inspect "${image}:latest" \
              --format '{{.Manifest.Digest}}')"
            released="$(docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{.Manifest.Digest}}')"
            if [ "$pointer" != "$released" ]; then
              echo "::error::${image}:latest (${pointer}) does not match ${image}:${VERSION} (${released})"
              exit 1
            fi
          done

      - name: Prepare the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk -v tag="$TAG" '$0==tag{found=1; next} found && $0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/{print; exit}')"

          notes_file="$(mktemp)"
          : > "$notes_file"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${TAG}"
            echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG}"

            mapfile -t subjects < <(git log --no-merges --format='%s' "${range}" 2>/dev/null || true)
            fixes_file="$(mktemp)"
            changes_file="$(mktemp)"
            highlights_file="$(mktemp)"
            : > "$fixes_file"; : > "$changes_file"; : > "$highlights_file"

            # Prefer merged PR titles for highlights when available.
            pr_numbers="$(git log --format=%s "${range}" | sed -nE 's/.*\(#([0-9]+)\).*/\1/p' | sort -u || true)"
            if [ -n "$pr_numbers" ]; then
              while IFS= read -r pr; do
                [ -n "$pr" ] || continue
                title="$(gh pr view "$pr" --json title --jq '.title' 2>/dev/null || true)"
                if [ -n "$title" ]; then
                  echo "- ${title} (#${pr})" >> "$highlights_file"
                fi
              done <<< "$pr_numbers"
            fi

            for s in "${subjects[@]}"; do
              [ -n "$s" ] || continue
              case "$s" in
                fix*|Fix*|bugfix*|hotfix*) echo "- ${s}" >> "$fixes_file" ;;
                feat*|Feat*) echo "- ${s}" >> "$highlights_file" ;;
                *) echo "- ${s}" >> "$changes_file" ;;
              esac
            done

            if [ -s "$highlights_file" ]; then
              echo "## Highlights" >> "$notes_file"; echo >> "$notes_file"
              awk '!seen[$0]++' "$highlights_file" | head -20 >> "$notes_file"
              echo >> "$notes_file"
            fi
            if [ -s "$fixes_file" ]; then
              echo "## Fixes" >> "$notes_file"; echo >> "$notes_file"
              awk '!seen[$0]++' "$fixes_file" | head -20 >> "$notes_file"
              echo >> "$notes_file"
            fi
            if [ -s "$changes_file" ]; then
              echo "## Changes" >> "$notes_file"; echo >> "$notes_file"
              awk '!seen[$0]++' "$changes_file" | head -30 >> "$notes_file"
              echo >> "$notes_file"
            fi
            if [ ! -s "$notes_file" ]; then
              echo "## Highlights" >> "$notes_file"; echo >> "$notes_file"
              echo "- Release ${TAG}." >> "$notes_file"; echo >> "$notes_file"
            fi

            echo "## Deployment notes" >> "$notes_file"
            echo >> "$notes_file"
            echo "- CI-validated source revision for this release tag." >> "$notes_file"
            echo "- API and Web images were built, verified, and published before this release was published." >> "$notes_file"
            echo "- Image digests and build attestations are recorded below." >> "$notes_file"
            echo "- Full diff: ${compare_url}" >> "$notes_file"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            cat > "$notes_file" <<'EOF'
          ## Highlights

          - Initial automated release publication for this version tag.

          ## Deployment notes

          - CI-validated source revision for this release tag.
          - API and Web images were built, verified, and published before this release was published.
          - Image digests and build attestations are recorded below.
          EOF
          fi

          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Build the release body
        id: release_body
        env:
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          VERSION: ${{ steps.validate.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          {
            echo "ChaharSooq release \`${TAG}\`."
            echo
            echo "- API and Web container images."
            echo "- CI-validated source revision."
            echo "- Image digests and build attestations are recorded in this release."
            echo
            cat "$NOTES_FILE"
            echo
            echo "<!-- chaharsooq:image-digests:start -->"
            echo "### Released container images"
            echo
            echo "| Image | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| API | \`${API_IMAGE}:${VERSION}\` | \`${API_DIGEST}\` |"
            echo "| Web | \`${WEB_IMAGE}:${VERSION}\` | \`${WEB_DIGEST}\` |"
            echo
            echo "Commit: \`${SHA}\`"
            echo
            echo "\`latest\` is a discovery pointer only. Production resolves it to a digest and verifies the release labels before deploying. Explicit digest references:"
            echo
            echo '```bash'
            echo "export CHAHARSOQ_API_IMAGE='${API_IMAGE}@${API_DIGEST}'"
            echo "export CHAHARSOQ_WEB_IMAGE='${WEB_IMAGE}@${WEB_DIGEST}'"
            echo '```'
            echo "<!-- chaharsooq:image-digests:end -->"
          } > "$body_file"
          echo "body_file=${body_file}" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_FILE: ${{ steps.release_body.outputs.body_file }}
          DRAFT_ID: ${{ steps.release.outputs.draft_id }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          # Both images are published and verified; nothing in this body is a
          # promise about work that has not finished. Fail closed if another
          # run published the release while this one was building.
          # `gh api` prints the HTTP error body to stdout on a 404. Only its
          # exit status distinguishes an absent release from a published one:
          # swallowing it made the first release look concurrent. Any other
          # API failure is unknown state and must not be treated as absent.
          if current_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
            release_exists=true
          else
            release_exists=false
            state="$(jq -r '.status // empty' <<<"$current_json" 2>/dev/null || true)"
            if [ "$state" != "404" ]; then
              echo "::error::could not determine release state for ${TAG}; refusing to publish"
              exit 1
            fi
          fi
          if [ "$release_exists" = true ] && [ "$(jq -r '.draft' <<<"$current_json")" != "true" ]; then
            echo "::error::release ${TAG} was published concurrently; refusing to overwrite it"
            exit 1
          fi
          if [ -n "$DRAFT_ID" ]; then
            gh release edit "$TAG" \
              --draft=false \
              --latest \
              --title "ChaharSooq ${TAG}" \
              --notes-file "$BODY_FILE"
          else
            gh release create "$TAG" \
              --title "ChaharSooq ${TAG}" \
              --notes-file "$BODY_FILE" \
              --target "$SHA" \
              --latest
          fi

      - name: Record the release images
        id: record
        env:
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          VERSION: ${{ steps.validate.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg release "$TAG" \
            --arg version "$VERSION" \
            --arg sha "$SHA" \
            --arg api_image "$API_IMAGE" \
            --arg api_digest "$API_DIGEST" \
            --arg web_image "$WEB_IMAGE" \
            --arg web_digest "$WEB_DIGEST" \
            '{release: $release, version: $version, commit: $sha,
              images: [
                {name: "api", repository: $api_image, tag: $version, digest: $api_digest},
                {name: "web", repository: $web_image, tag: $version, digest: $web_digest}
              ]}' > release-images.json
          {
            echo "### Released container images"
            echo
            echo "| Image | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| API | \`${API_IMAGE}:${VERSION}\` | \`${API_DIGEST}\` |"
            echo "| Web | \`${WEB_IMAGE}:${VERSION}\` | \`${WEB_DIGEST}\` |"
            echo
            echo "Commit: \`${SHA}\`"
            echo
            echo '`latest` is only a discovery pointer. Deploy by digest, never by the tag:'
            echo
            echo '```bash'
            echo "export CHAHARSOQ_API_IMAGE='${API_IMAGE}@${API_DIGEST}'"
            echo "export CHAHARSOQ_WEB_IMAGE='${WEB_IMAGE}@${WEB_DIGEST}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-images
          path: release-images.json
          retention-days: 90
