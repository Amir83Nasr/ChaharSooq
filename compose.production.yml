# Production stack for market-linux. Development lives in compose.local.yml and the
# two files are intentionally independent: nothing here is inherited from the
# development file or from .env files.
#
# Secrets are file-backed and live outside this repository. Set
# CHARSOOQ_SECRETS_DIR to the directory that holds them (default:
# /etc/charsooq/secrets); see README.md (Production Docker stack) and
# AGENTS.md section 3 for the required names, ownership, and permissions.
# No secret value belongs here.
#
# Deployment values are required and deliberately have no default, so an
# unconfigured stack fails to start instead of publishing a port on every
# interface, guessing an internal subnet, or trusting an unverified proxy:
#   CHARSOOQ_PROXY_BIND_IP  approved internal IP that Caddy binds 80/443 to
#   CHARSOOQ_SITE_HOST      internal DNS name or IP that users open
#   CHARSOOQ_EDGE_SUBNET    conflict-checked CIDR for the web<->api network
#   CHARSOOQ_WEB_EDGE_IP    web's fixed address; the API's only trusted proxy
# See README.md (Production Docker stack) and AGENTS.md section 3.
#
# deploy/scripts/deploy.sh is the single deploy entry point. It pulls the
# released images by digest, runs provision and migrate once, then starts the
# api/web pair. Caddy forwards to the single `web` service.
name: chaharsooq-production

# OCI metadata for a locally built image. `make prod-build` fills these in
# from the checkout, so even the host-build fallback carries the commit it
# came from. A manual `docker compose build` leaves them at their defaults,
# which mark the image as not release-tracked.
x-build-args: &build-args
  VCS_REF: ${CHARSOOQ_BUILD_REVISION:-unknown}
  BUILD_DATE: ${CHARSOOQ_BUILD_DATE:-unknown}
  VERSION: ${CHARSOOQ_BUILD_VERSION:-unknown}
  SOURCE: ${CHARSOOQ_BUILD_SOURCE:-unknown}

x-api-image: &api-image
  # Production runs published images, never an ad-hoc host build. The
  # reference is required and has no default: an unset or moving reference
  # must fail closed instead of silently running whatever happens to sit in
  # the local image cache. Select a release by digest:
  #   export CHAHARSOQ_API_IMAGE='ghcr.io/<namespace>/chaharsooq-api@sha256:<digest>'
  # See AGENTS.md section 3 (release flow).
  image: ${CHAHARSOQ_API_IMAGE:?set CHAHARSOQ_API_IMAGE to the released image reference, for example ghcr.io/<namespace>/chaharsooq-api@sha256:<digest>}
  # Pull the published image when it is not in the local cache. With a digest
  # reference this is what makes the deployed bytes the released bytes.
  pull_policy: missing
  build:
    context: .
    dockerfile: Dockerfile.api
    args: *build-args

x-web-image: &web-image
  # Same contract as the API image: an explicit, immutable reference and no
  # default. `CHAHARSOQ_WEB_IMAGE` must come from the same release as
  # `CHAHARSOQ_API_IMAGE`.
  image: ${CHAHARSOQ_WEB_IMAGE:?set CHAHARSOQ_WEB_IMAGE to the released image reference, for example ghcr.io/<namespace>/chaharsooq-web@sha256:<digest>}
  pull_policy: missing
  build:
    context: .
    dockerfile: Dockerfile.web
    args:
      <<: *build-args
      API_URL_INTERNAL: http://api:8000

x-service-env: &service-env
  APP_ENV: production
  DEPLOYMENT_ENV: production
  SECRETS_DIR: /run/secrets

x-api-env: &api-env
  <<: *service-env
  # The ordered one-shot steps below are the only supported path in Production.
  RUN_MIGRATIONS_ON_STARTUP: "false"
  RUN_OWNER_BOOTSTRAP_ON_STARTUP: "false"
  # Browser traffic is same-origin through Next's /api/* rewrite, so no
  # cross-origin browser requests are allowed.
  CORS_ORIGINS: ""
  SESSION_SAMESITE: lax
  # Logical archives live on a named volume the API user owns. Mounted only
  # into `api` below; the one-shot provision/migrate steps never need it.
  BACKUP_DIR: /var/backups/charsooq

# Docker's json-file driver has no size limit by default, so an unrotated
# stdout stream can fill the host disk and take PostgreSQL with it. Bound every
# service's log at the container level.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-service: &api-service
  <<: *api-image
  restart: unless-stopped
  logging: *default-logging
  environment:
    <<: *api-env
    # Temporary for the current HTTP-only internal deployment. Set to "true" once
    # HTTPS is enabled for Production.
    SESSION_COOKIE_SECURE: "false"
  secrets:
    - database_url
    - session_secret
    - owner_password
    - parsina_password
  expose:
    - "8000"
  networks:
    - backend
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M

x-web-service: &web-service
  <<: *web-image
  restart: unless-stopped
  logging: *default-logging
  environment:
    NODE_ENV: production
    API_URL_INTERNAL: http://api:8000
    HOSTNAME: 0.0.0.0
    PORT: "3000"
  expose:
    - "3000"
  networks:
    - proxy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/login').then((r)=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M

services:
  db:
    image: postgres:19.0-trixie
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: charsooq
      POSTGRES_USER: charsooq
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # PostgreSQL 19 stores its cluster in /var/lib/postgresql/19/docker and the
    # image's declared volume is the /var/lib/postgresql parent. Mounting the
    # old /var/lib/postgresql/data path would persist an empty directory. Never
    # start a 19 image against an 18 cluster — the entrypoint would create an
    # empty 19 cluster beside it and the app would see no data.
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charsooq -d charsooq -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # One-shot role and grant provisioning. It connects with the container's
  # administrative role (postgres_password) and reads the two database URLs to
  # derive the application and migration role names/passwords. Idempotent on
  # both a fresh volume and an existing single-role volume.
  provision:
    <<: *api-image
    command: ["python", "backend/api/scripts/provision_database_roles.py"]
    logging: *default-logging
    environment:
      <<: *service-env
      # Name of the image-created administrative role, not a secret.
      POSTGRES_USER: charsooq
    secrets:
      - postgres_password
      - database_url
      - migration_database_url
    # The postgres_password file is owned by the PostgreSQL image user
    # (999:999) and mode 0440. The API image runs as 10001, so this one-shot
    # service joins GID 999 to read that file; the other two secrets are
    # owned by 10001 and need no extra group.
    group_add:
      - "999"
    restart: "no"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # One-shot schema upgrade. It exits 0 only when the database is at head, and
  # the active slot API must not be started until this service completes
  # successfully. A failure therefore stops the release with the database
  # untouched by the new slot. It receives only the migration credential: no
  # administrative password and no application URL.
  migrate:
    <<: *api-image
    command: ["python", "backend/api/scripts/migrate.py"]
    logging: *default-logging
    environment: *api-env
    secrets:
      - migration_database_url
    restart: "no"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # Internal reverse proxy (HTTP-only or HTTPS/TLS, configuration-driven). It is
  # attached to `proxy` only, so it has no route to the API, `db`, `provision`,
  # or `migrate`. It publishes 80/443 bound to one approved internal IP and
  # nothing else; no Docker socket and no host filesystem beyond the read-only
  # config directories below. It forwards to the single `web` service.
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      # `{$VAR}` in the Caddyfile reads these. Protocol/TLS are explicit config:
      # HTTP-only (current temporary Production): PUBLIC_SCHEME=http, TLS_MODE=none,
      # CADDY_AUTO_HTTPS=off. HTTPS: PUBLIC_SCHEME=https, TLS_MODE=organization|internal-ca.
      CHARSOOQ_SITE_HOST: ${CHARSOOQ_SITE_HOST:?set CHARSOOQ_SITE_HOST to the approved internal DNS name or IP}
      CHARSOOQ_PUBLIC_SCHEME: ${CHARSOOQ_PUBLIC_SCHEME:-https}
      # Published port, used for X-Forwarded-Port (80 for HTTP-only, 443 for HTTPS).
      CHARSOOQ_PUBLIC_PORT: ${CHARSOOQ_PUBLIC_PORT:-443}
      CHARSOOQ_CADDY_AUTO_HTTPS: ${CHARSOOQ_CADDY_AUTO_HTTPS:-off}
      # HTTPS: organization (files from the organization CA) or internal-ca.
      # HTTP-only: none (no TLS, no redirect, no HSTS).
      CHARSOOQ_TLS_MODE: ${CHARSOOQ_TLS_MODE:-organization}
      # HSTS max-age in seconds for HTTPS modes only (tls-none does not send HSTS).
      CHARSOOQ_HSTS_MAX_AGE: ${CHARSOOQ_HSTS_MAX_AGE:-31536000}
    ports:
      # host_ip:host_port:container_port. Binding an explicit IP is required:
      # a bare "80:80" would publish on every interface. IPv6 is not configured.
      # Port bindings are kept as configured; active protocol/listener behavior is
      # controlled by Caddy config values (HTTP-only or HTTPS).
      - "${CHARSOOQ_PROXY_BIND_IP:?set CHARSOOQ_PROXY_BIND_IP to the approved internal IP}:80:80"
      - "${CHARSOOQ_PROXY_BIND_IP:?set CHARSOOQ_PROXY_BIND_IP to the approved internal IP}:443:443"
    volumes:
      # Certificate authority, issued certificates, and OCSP state. Losing this
      # volume rotates Caddy's internal CA and breaks every trusting client.
      # Mount it before the certificate directory: that mountpoint is created
      # inside this writable volume.
      - caddy_data:/data
      # Read-only Caddyfile and snippets, including the static upstream.
      - ./deploy/caddy:/etc/caddy:ro
      # Certificate material stays outside the repository. Unused in
      # `internal-ca` mode; the directory may be empty. It must not be nested
      # under /etc/caddy, which is a read-only bind mount: Docker cannot create
      # a mountpoint there while the root filesystem is read-only.
      - ${CHARSOOQ_TLS_DIR:-/etc/charsooq/tls}:/data/certs:ro
      - caddy_config:/config
    networks:
      - proxy
    # Caddy binds low ports, so it keeps NET_BIND_SERVICE and drops the rest.
    # The root filesystem is read-only; /data, /config, and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  # Single deployable pair. The web image bakes API_URL_INTERNAL=http://api:8000
  # at build time, so the API is reachable as the network alias `api` on `edge`.
  # Caddy publishes to `web`; a deploy is a plain `docker compose up -d`.
  api:
    <<: *api-service
    environment:
      <<: *api-env
      SESSION_COOKIE_SECURE: "false"
      # Uvicorn's --proxy-headers trusts forwarded headers only from this peer:
      # web's fixed address on edge, never a wildcard.
      FORWARDED_ALLOW_IPS: ${CHARSOOQ_WEB_EDGE_IP:?set CHARSOOQ_WEB_EDGE_IP to the web fixed address on edge}
    # Named volume, so an image update keeps the archives. The image creates the
    # directory owned by UID/GID 10001, so no extra init service is required.
    volumes:
      - backups:/var/backups/charsooq
    networks:
      backend: {}
      edge:
        aliases:
          - api

  web:
    <<: *web-service
    networks:
      proxy:
        aliases:
          - web
      edge:
        ipv4_address: ${CHARSOOQ_WEB_EDGE_IP:?set CHARSOOQ_WEB_EDGE_IP to the web fixed address on edge}
    depends_on:
      api:
        condition: service_healthy

networks:
  # Caddy <-> web only. Deliberately has no explicit subnet: Docker's address
  # pool may still collide with the organization's routes, so a subnet is only
  # assigned after the conflict check recorded in the deployment documentation.
  proxy:
    driver: bridge
  # Database-only network: PostgreSQL has no route to the outside world.
  backend:
    internal: true
  # web <-> api. The subnet comes from the operator because a guessed CIDR can
  # collide with the internal network of the organization.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${CHARSOOQ_EDGE_SUBNET:?set CHARSOOQ_EDGE_SUBNET to an approved, conflict-free CIDR}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # Backup archives. Never removed by a deploy; retention prunes files inside it.
  backups:

secrets:
  # File-backed Compose secrets are bind-mounted read-only into /run/secrets.
  # Host owner/mode are what the container sees; `uid`/`gid`/`mode` here would
  # only apply to Swarm secrets, so they are deliberately not set.
  postgres_password:
    file: ${CHARSOOQ_SECRETS_DIR:-/etc/charsooq/secrets}/postgres_password
  database_url:
    file: ${CHARSOOQ_SECRETS_DIR:-/etc/charsooq/secrets}/database_url
  migration_database_url:
    file: ${CHARSOOQ_SECRETS_DIR:-/etc/charsooq/secrets}/migration_database_url
  session_secret:
    file: ${CHARSOOQ_SECRETS_DIR:-/etc/charsooq/secrets}/session_secret
  owner_password:
    file: ${CHARSOOQ_SECRETS_DIR:-/etc/charsooq/secrets}/owner_password
  parsina_password:
    file: ${CHARSOOQ_SECRETS_DIR:-/etc/charsooq/secrets}/parsina_password
