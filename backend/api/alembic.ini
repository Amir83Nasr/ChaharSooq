[alembic]
script_location = migrations
prepend_sys_path = .
# No database URL here on purpose. migrations/env.py resolves it through
# DatabaseSettings (DATABASE_URL or SECRETS_DIR), so a stale committed URL
# can never become an implicit target.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
